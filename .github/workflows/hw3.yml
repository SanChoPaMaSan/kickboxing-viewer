name: HW3 Docker CI and blue-green deployment
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hw3-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test deployment orchestration
        run: python -m unittest discover -s deploy/tests -v
      - name: Build image (includes application tests and type checking)
        run: docker build --build-arg RELEASE="$GITHUB_SHA" -t strikelab:ci .
      - name: Smoke-test the actual container
        shell: bash
        run: |
          docker run -d --name hw3-smoke -p 127.0.0.1:8090:80 strikelab:ci
          trap 'docker logs hw3-smoke; docker rm -f hw3-smoke' EXIT
          curl --fail --retry 20 --retry-all-errors --retry-delay 1 http://127.0.0.1:8090/healthz
          python deploy/probe.py http://127.0.0.1:8090 --seconds 2 --expected-release "$GITHUB_SHA"
      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish the tested image
        id: publish
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.DOCKERHUB_USERNAME != ''
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
        shell: bash
        run: |
          image="${DOCKERHUB_USERNAME}/strikelab:${GITHUB_SHA}"
          docker tag strikelab:ci "$image"
          docker push "$image"
          digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$image")
          echo "image=$digest" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HW3_DEPLOY_ENABLED == 'true' && needs.image.outputs.image != ''
    needs: image
    runs-on: [self-hosted, linux, x64, strikelab]
    environment: hw3-production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify candidate and switch traffic
        env:
          IMAGE: ${{ needs.image.outputs.image }}
        run: python3 deploy/deploy.py "$IMAGE" "$GITHUB_SHA" --port 8081
